<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統計2級 実技支援ツール</title>
<script src="https://cdn.jsdelivr.net/npm/jstat@1.9.6/dist/jstat.min.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --panel: #1a1d27;
    --border: #2a2d3e;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --green: #22c55e;
    --yellow: #f59e0b;
    --red: #ef4444;
    --text: #e2e8f0;
    --muted: #64748b;
    --card-hover: #20243a;
    --mono: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); z-index: 20; }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.05em; }
  .badge { font-size: 0.7rem; background: var(--accent2); color: #fff; padding: 2px 8px; border-radius: 999px; }
  .pyo-status { font-size: 0.7rem; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-left: 4px; }
  .pyo-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); transition: background 0.3s; }
  .pyo-dot.ready { background: var(--green); }
  .pyo-dot.error { background: var(--red); }
  .reset-btn { margin-left: auto; background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: none; white-space: nowrap; }
  .reset-btn:hover { border-color: var(--red); color: var(--red); }

  .container { max-width: 880px; margin: 0 auto; padding: 32px 24px 80px; }
  .screen { display: none; }
  .screen.active { display: block; }

  /* ── HOME ── */
  /* intro は折りたたみ式に変更 */
  .intro-toggle { font-size: 0.8rem; color: var(--muted); cursor: pointer; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px; user-select: none; }
  .intro-toggle:hover { color: var(--text); }
  .intro-body { color: var(--muted); font-size: 0.82rem; margin-bottom: 20px; line-height: 1.8; display: none; padding: 10px 14px; background: var(--panel); border-radius: 8px; border: 1px solid var(--border); }
  .intro-body.open { display: block; }
  .intro-body strong { color: var(--text); }

  .cat-section { margin-bottom: 36px; }
  .cat-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .cat-emoji { font-size: 1.4rem; }
  .cat-title { font-size: 1.1rem; font-weight: 700; }
  .cat-desc { font-size: 0.82rem; color: #94a3b8; margin-bottom: 14px; }

  /* カードは1列表示で手がかりを読ませる */
  .pattern-grid { display: flex; flex-direction: column; gap: 8px; }
  .pattern-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.12s;
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 6px 16px;
    align-items: start;
  }
  .pattern-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 4px; border-radius: 10px 0 0 10px; }
  .cat-group1 .pattern-card::before { background: var(--accent); }
  .cat-group2 .pattern-card::before { background: var(--green); }
  .cat-relation .pattern-card::before { background: var(--accent2); }
  .cat-design .pattern-card::before { background: var(--yellow); }
  .pattern-card:hover { background: var(--card-hover); border-color: var(--accent); }
  /* card-num は非表示 */
  .card-num { display: none; }
  /* タイトルは左上・大きめ */
  .card-title { font-size: 0.95rem; font-weight: 700; line-height: 1.4; grid-column: 1; grid-row: 1; padding-left: 8px; }
  /* 使用分布は右上・アクセントカラーで目立たせる */
  .card-dist { font-size: 0.8rem; font-weight: 700; color: #7dd3fc; grid-column: 2; grid-row: 1; white-space: nowrap; align-self: center; }
  /* キーワードは左下・「問題文の手がかり」 */
  .card-keywords { display: flex; flex-wrap: wrap; gap: 4px; grid-column: 1 / 3; grid-row: 2; padding-left: 8px; }
  .kw { font-size: 0.72rem; background: rgba(255,255,255,0.06); color: #94a3b8; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.08); }
  /* 手がかりキーワードは特別に強調 */
  .kw.trigger { background: rgba(79,142,247,0.15); color: #93c5fd; border-color: rgba(79,142,247,0.3); }

  /* ── WIZARD ── */
  .wiz-head { margin-bottom: 20px; }
  .wiz-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
  /* 使用分布を大きく・目立たせる */
  .wiz-dist { font-size: 1rem; font-weight: 700; color: #7dd3fc; margin-bottom: 2px; }
  .formula-hint { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 8px; padding: 12px 16px; margin: 12px 0 20px; font-size: 0.88rem; line-height: 1.9; color: #c4b5fd; }
  .formula-hint .f-title { font-size: 0.72rem; color: var(--accent2); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }

  .chat-log { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .chat-q { font-size: 0.8rem; color: var(--muted); margin-bottom: 3px; }
  .chat-a-row { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 9px 14px; }
  .chat-a-row .a-label { font-size: 0.8rem; color: #94a3b8; min-width: 0; flex: 1; }
  .chat-a-row .a-val { font-family: var(--mono); font-weight: 700; font-size: 1rem; color: var(--accent); white-space: nowrap; }

  .active-q { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 18px 20px; margin-bottom: 18px; }
  .active-q .q-label { font-size: 1rem; font-weight: 700; margin-bottom: 6px; line-height: 1.5; }
  .active-q .q-hint { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; }
  .active-q input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 11px 14px; font-size: 1.1rem; outline: none; font-family: var(--mono);
  }
  .active-q input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(79,142,247,0.15); }
  .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice-btn {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 11px 20px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: all 0.12s;
  }
  .choice-btn:hover { border-color: var(--accent); background: var(--card-hover); color: #fff; }
  .next-btn {
    margin-top: 14px; background: var(--accent); color: #fff; border: none; padding: 11px 26px;
    border-radius: 8px; font-size: 0.95rem; font-weight: 700; cursor: pointer;
  }
  .next-btn:hover { opacity: 0.85; }
  /* progress を目立たせる */
  .progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; font-weight: 600; letter-spacing: 0.03em; }

  /* ── RESULT ── */
  .result-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .result-title { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 14px; }
  .result-values { display: flex; flex-wrap: wrap; gap: 16px 24px; margin-bottom: 16px; }
  /* label と num のサイズ差を縮める */
  .result-val { display: flex; flex-direction: column; gap: 3px; }
  .result-val .label { font-size: 0.82rem; color: #94a3b8; font-weight: 500; }
  .result-val .num { font-size: 1.2rem; font-weight: 700; color: var(--accent); font-family: var(--mono); }
  .result-interpret { background: rgba(79,142,247,0.08); border-left: 3px solid var(--accent); padding: 12px 16px; font-size: 0.9rem; line-height: 1.8; border-radius: 0 6px 6px 0; white-space: pre-line; }
  .error-msg { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: var(--red); padding: 10px 14px; border-radius: 6px; font-size: 0.88rem; margin-bottom: 12px; }

  /* ── CODE / PYODIDE ── */
  .code-box { background: #0d1117; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .code-lang { font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
  .code-btns { display: flex; gap: 8px; }
  .copy-btn, .run-btn { border: none; padding: 5px 14px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; color: #fff; }
  .copy-btn { background: var(--border); color: var(--text); }
  .copy-btn:hover { background: #3a3f55; }
  .copy-btn.copied { background: var(--green); color: #fff; }
  .run-btn { background: var(--green); font-weight: 700; }
  .run-btn:hover { opacity: 0.85; }
  .run-btn:disabled { background: var(--border); color: var(--muted); cursor: wait; }
  #codeEditor {
    width: 100%; min-height: 220px; background: #0d1117; border: none; outline: none; resize: vertical;
    color: #a5f3fc; font-family: var(--mono); font-size: 0.82rem; line-height: 1.7; padding: 16px;
  }
  .py-output-box { background: #0d1117; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .py-output-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 0.72rem; color: var(--muted); font-family: var(--mono); }
  #pyOutput { padding: 16px; font-family: var(--mono); font-size: 0.82rem; line-height: 1.7; color: #86efac; white-space: pre-wrap; min-height: 24px; }
  #pyOutput.err { color: var(--red); }

  .calc-btn {
    background: var(--accent); color: #fff; border: none; padding: 10px 28px; border-radius: 8px;
    font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-bottom: 24px;
  }
  .calc-btn:hover { opacity: 0.85; }

  /* ── FOLLOW-UP SUGGESTIONS ── */
  .followup-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 18px 0 10px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
    flex-wrap: wrap;
  }
  .followup-icon { font-size: 1.3rem; }
  .followup-title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .followup-sub { font-size: 0.78rem; color: var(--muted); flex-basis: 100%; padding-left: 2px; margin-top: -4px; }
  .followup-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .followup-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
    overflow: hidden;
  }
  .followup-card::before {
    content: '';
    position: absolute; top: 0; left: 0; bottom: 0; width: 4px;
    border-radius: 10px 0 0 10px;
  }
  .followup-card.type-extend::before  { background: #f59e0b; }
  .followup-card.type-next::before    { background: #22c55e; }
  .followup-card.type-related::before { background: #7c3aed; }
  .followup-card.type-design::before  { background: #06b6d4; }
  .followup-card:hover { background: var(--card-hover); border-color: var(--accent); transform: translateX(2px); }
  .followup-card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .followup-badge {
    font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px;
    white-space: nowrap; letter-spacing: 0.05em;
  }
  .type-extend  .followup-badge { background: rgba(245,158,11,0.2);  color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
  .type-next    .followup-badge { background: rgba(34,197,94,0.2);   color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
  .type-related .followup-badge { background: rgba(124,58,237,0.2);  color: #a78bfa; border: 1px solid rgba(124,58,237,0.4); }
  .type-design  .followup-badge { background: rgba(6,182,212,0.2);   color: #67e8f9; border: 1px solid rgba(6,182,212,0.4); }
  .followup-card-title { font-size: 0.92rem; font-weight: 700; }
  .followup-card-reason { font-size: 0.8rem; color: #94a3b8; line-height: 1.6; }
  .followup-card-action {
    display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
    font-size: 0.78rem; font-weight: 700; color: var(--accent);
  }
  .followup-card-action::after { content: '→'; }

</style>
</head>
<body>

<header>
  <div>📊</div>
  <h1>統計2級 実技支援ツール</h1>
  <span class="badge">推測統計</span>
  <span class="pyo-status"><span class="pyo-dot" id="pyoDot"></span><span id="pyoLabel">Python準備中…</span></span>
  <button class="reset-btn" id="resetBtn" onclick="goHome()">🔄 最初からやり直す</button>
</header>

<div class="container">

  <!-- HOME -->
  <div class="screen active" id="homeScreen">
    <div class="intro-toggle" onclick="this.nextElementSibling.classList.toggle('open')">
      ℹ️ 使い方を見る ▾
    </div>
    <div class="intro-body">
      問題文の<strong>手がかり</strong>（「σが与えられている」「データ列が与えられている」など）からカードを選びます。<br>
      質問に答えながら数値を入力 → <strong>計算する</strong> で即時結果 + Pythonコードが出ます。<br>
      間違えたら上の「🔄 最初からやり直す」でリセット。
    </div>
    <div id="catSections"></div>
  </div>

  <!-- WIZARD -->
  <div class="screen" id="wizScreen">
    <div class="wiz-head">
      <div class="wiz-title" id="wizTitle"></div>
      <div class="wiz-dist" id="wizDist"></div>
      <div class="formula-hint" id="wizFormula"></div>
    </div>

    <div class="progress" id="wizProgress"></div>
    <div class="chat-log" id="chatLog"></div>
    <div class="active-q" id="activeQ"></div>

    <div id="calcStage" style="display:none;">
      <button class="calc-btn" onclick="runCalculate()">計算する</button>
      <div class="error-msg" id="errorMsg" style="display:none;"></div>

      <div class="result-box" id="resultBox" style="display:none;">
        <div class="result-title">計算結果（即時・JS）</div>
        <div class="result-values" id="resultValues"></div>
        <div class="result-interpret" id="resultInterpret"></div>
      </div>

      <!-- ★ 派生分析サジェスト ★ -->
      <div id="followUpPanel" style="display:none;">
        <div class="followup-header">
          <span class="followup-icon">🔀</span>
          <span class="followup-title">次の分析へ展開する</span>
          <span class="followup-sub">この結果を踏まえて、派生する問題に有機的につなげよう</span>
        </div>
        <div id="followUpCards" class="followup-cards"></div>
      </div>

      <div class="code-box" id="codeBox" style="display:none;">
        <div class="code-header">
          <span class="code-lang">python（編集可）</span>
          <div class="code-btns">
            <button class="copy-btn" id="copyBtn" onclick="copyCode()">コピー</button>
            <button class="run-btn" id="runBtn" onclick="runPython()">▶ 実行（検算）</button>
          </div>
        </div>
        <textarea id="codeEditor" spellcheck="false"></textarea>
      </div>

      <div style="height:12px"></div>
      <div class="py-output-box" id="pyOutputBox" style="display:none;">
        <div class="py-output-head">実行結果（Pyodide）</div>
        <div id="pyOutput"></div>
      </div>
    </div>
  </div>

</div>

<script>
// ─── Categories（傾向・流れ別） ─────────────────────────────────────
const CATEGORIES = [
  { id: 'group1',   emoji: '📐', title: '1グループを調べる',     desc: '1つの母集団の平均・比率・分散を推定／検定したい' },
  { id: 'group2',   emoji: '⚖️', title: '2グループを比較する',   desc: 'ABテスト型の比率比較、2群の平均比較など' },
  { id: 'relation', emoji: '🔗', title: '関係性を調べる',         desc: '相関・回帰など、2つの変数の関係を調べたい' },
  { id: 'design',   emoji: '📏', title: '設計する',               desc: '必要なサンプルサイズを逆算したい' },
];

// ─── Pattern definitions ────────────────────────────────────────────
const PATTERNS = [
  // ── 1グループを調べる ──
  {
    id: 'ci_mean_z', flowCat: 'group1',
    title: '母平均の区間推定（母分散既知・z分布）',
    dist: 'z分布（標準正規分布）',
    keywords: ['σ（母標準偏差）が数値で与えられている', '「σ=◯」「過去のσ」という記述がある', '大標本 n≥30 かつσ既知'],
    formula: '<div class="f-title">公式</div>x̄ ± z(α/2) × σ/√n<br><span style="color:#94a3b8">z(α/2): 95%→1.960, 99%→2.576, 90%→1.645</span>',
    fields: [
      { id: 'n', label: 'サンプルサイズ n は？', type: 'number', default: 100 },
      { id: 'mean', label: '標本平均 x̄ は？', type: 'number', default: 50, step: 0.01 },
      { id: 'sigma', label: '母標準偏差 σ（既知の値）は？', type: 'number', default: 10, step: 0.01 },
      { id: 'conf', label: '信頼水準は？', type: 'select', options: ['0.95:95%', '0.99:99%', '0.90:90%'] },
    ],
    calc(v) {
      const z = jStat.normal.inv(1 - (1-v.conf)/2, 0, 1);
      const se = v.sigma / Math.sqrt(v.n);
      const margin = z * se;
      const lo = v.mean - margin, hi = v.mean + margin;
      return {
        vals: [
          { label: 'z値', val: z.toFixed(3) },
          { label: '標準誤差 SE', val: se.toFixed(4) },
          { label: '誤差の幅 E', val: margin.toFixed(4) },
          { label: '信頼区間 下限', val: lo.toFixed(4) },
          { label: '信頼区間 上限', val: hi.toFixed(4) },
        ],
        interpret: `母平均の${(v.conf*100).toFixed(0)}%信頼区間は [${lo.toFixed(3)}, ${hi.toFixed(3)}] です。\n真の母平均がこの区間に含まれる確率が${(v.conf*100).toFixed(0)}%と解釈できます。`,
        code: `import numpy as np
from scipy import stats

n = ${v.n}
x_bar = ${v.mean}  # 標本平均
sigma = ${v.sigma}  # 母標準偏差（既知）
conf = ${v.conf}  # 信頼水準

se = sigma / np.sqrt(n)
z = stats.norm.ppf(1 - (1 - conf) / 2)
margin = z * se

lo = x_bar - margin
hi = x_bar + margin

print(f"z値: {z:.3f}")
print(f"標準誤差: {se:.4f}")
print(f"信頼区間: [{lo:.4f}, {hi:.4f}]")`
      };
    }
  },
  {
    id: 'ci_mean_t', flowCat: 'group1',
    title: '母平均の区間推定（母分散未知・t分布）',
    dist: 't分布（自由度 n-1）',
    keywords: ['σが与えられていない・不明', '「不偏標準偏差s」または「標本標準偏差」が与えられている', '小標本 n<30 でも使える'],
    formula: '<div class="f-title">公式</div>x̄ ± t(α/2, n-1) × s/√n<br><span style="color:#94a3b8">s: 不偏標準偏差, 自由度 φ = n-1</span>',
    fields: [
      { id: 'n', label: 'サンプルサイズ n は？', type: 'number', default: 15 },
      { id: 'mean', label: '標本平均 x̄ は？', type: 'number', default: 50, step: 0.01 },
      { id: 's', label: '不偏標準偏差 s は？', type: 'number', default: 8, step: 0.01 },
      { id: 'conf', label: '信頼水準は？', type: 'select', options: ['0.95:95%', '0.99:99%', '0.90:90%'] },
    ],
    calc(v) {
      const df = v.n - 1;
      const t = jStat.studentt.inv(1 - (1-v.conf)/2, df);
      const se = v.s / Math.sqrt(v.n);
      const margin = t * se;
      const lo = v.mean - margin, hi = v.mean + margin;
      return {
        vals: [
          { label: '自由度 φ', val: df },
          { label: 't値', val: t.toFixed(4) },
          { label: '標準誤差 SE', val: se.toFixed(4) },
          { label: '信頼区間 下限', val: lo.toFixed(4) },
          { label: '信頼区間 上限', val: hi.toFixed(4) },
        ],

y0 = b0 + b1*x0

      };
    }

        return hi - lo;
      };
      const w0 = ciW(v.n0);
      const wt = w0 * v.target_ratio;
      let nn = v.n0 + 1;

print(f"  楽観: {(y_target-b0)/b1_hi:.2f}")`,
      };
    }
  },

  // ── 選挙出口調査サンプルサイズ設計 ──
  {
    id: 'ci_election_n', flowCat: 'design',
    title: '選挙出口調査のサンプルサイズ設計（2候補の差を検出）',
    dist: 'z分布（正規近似）',
    keywords: ['2候補の差を統計的に断言したい', '「A候補がB候補より有意に多い」と言えるnは？', '2比率の差の信頼区間下限 > 0 を保証するn'],
    formula: '<div class="f-title">公式</div>n ≥ z² × (pA(1-pA) + pB(1-pB)) / (pA-pB)²<br><span style="color:#94a3b8">差の信頼区間下限 > 0 になる最小サンプルサイズ</span>',
    fields: [
      { id: 'pA',   label: 'A候補の想定得票率 pA', type: 'number', default: 0.55, step: 0.01 },
      { id: 'pB',   label: 'B候補の想定得票率 pB', type: 'number', default: 0.30, step: 0.01 },
      { id: 'conf', label: '信頼水準は？', type: 'select', options: ['0.95:95%', '0.99:99%', '0.90:90%'] },
    ],
    calc(v) {
      const z = jStat.normal.inv(1-(1-v.conf)/2, 0, 1);
      const diff = v.pA - v.pB;
      if (diff <= 0) return { error: 'pA > pB の場合のみ使えます' };
      const n_raw = z*z * (v.pA*(1-v.pA) + v.pB*(1-v.pB)) / (diff*diff);
      const n = Math.ceil(n_raw);
      const se = Math.sqrt((v.pA*(1-v.pA) + v.pB*(1-v.pB)) / n);
      const lo = diff - z*se;
      return {
        vals: [
          { label: 'pA - pB', val: diff.toFixed(4) },
          { label: 'z値', val: z.toFixed(4) },
          { label: '必要サンプルサイズ n', val: n },
          { label: '差の信頼区間下限（確認）', val: lo.toFixed(4) + (lo > 0 ? ' ✅' : ' ⚠️') },
        ],
        interpret: (v.conf*100).toFixed(0) + '%信頼度でA候補の当選を断言するには n = ' + n + ' 以上が必要。\n（差の信頼区間下限 = ' + lo.toFixed(4) + (lo > 0 ? ' > 0 ✅' : ' ≤ 0 ⚠️') + '）',
        code: `import numpy as np
from scipy import stats
import math

pA, pB, conf = ` + v.pA + `, ` + v.pB + `, ` + v.conf + `
z = stats.norm.ppf(1-(1-conf)/2)
diff = pA - pB
n_raw = z**2 * (pA*(1-pA) + pB*(1-pB)) / diff**2
n = math.ceil(n_raw)
se = np.sqrt((pA*(1-pA) + pB*(1-pB)) / n)
lo = diff - z * se
print(f"必要サンプルサイズ: n = {n}")
print(f"差の信頼区間下限: {lo:.4f} ({'OK' if lo > 0 else 'NG'})")`,
      };
    }
  },

];

// ─── Follow-up rendering ─────────────────────────────────────────────
function renderFollowUps(patternId) {
  const suggestions = FOLLOW_UPS[patternId];
  const panel = document.getElementById('followUpPanel');
  const cards = document.getElementById('followUpCards');

  if (!suggestions || suggestions.length === 0) {
    panel.style.display = 'none';
    return;
  }

  cards.innerHTML = suggestions.map(s => {
    const target = PATTERNS.find(p => p.id === s.targetId);
    if (!target) return '';
    return `
      <div class="followup-card type-${s.type}" onclick="jumpToFollowUp('${s.targetId}')">
        <div class="followup-card-head">
          <span class="followup-badge">${s.badge}</span>
          <span class="followup-card-title">${s.label}</span>
        </div>
        <div class="followup-card-reason">${s.reason}</div>
        <div class="followup-card-action">${s.action || '次の分析へ'}</div>
      </div>
    `;
  }).join('');

  panel.style.display = 'block';
}

function jumpToFollowUp(targetId) {
  const target = PATTERNS.find(p => p.id === targetId);
  if (target) startWizard(target);
}

// ─── Render home ─────────────────────────────────────────────────────
function renderHome() {
  const wrap = document.getElementById('catSections');
  wrap.innerHTML = '';
  CATEGORIES.forEach(cat => {
    const sec = document.createElement('div');
    sec.className = `cat-section cat-${cat.id}`;
    const pats = PATTERNS.filter(p => p.flowCat === cat.id);
    sec.innerHTML = `
      <div class="cat-head"><span class="cat-emoji">${cat.emoji}</span><span class="cat-title">${cat.title}</span></div>
      <div class="cat-desc">${cat.desc}</div>
      <div class="pattern-grid"></div>
    `;
    const grid = sec.querySelector('.pattern-grid');
    pats.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'pattern-card';
      const kwHtml = p.keywords.map((k,ki) => `<span class="kw${ki < 3 ? ' trigger' : ''}">${k}</span>`).join('');
      card.innerHTML = `
        <div class="card-title">${p.title}</div>
        <div class="card-dist">${p.dist}</div>
        <div class="card-keywords">${kwHtml}</div>
      `;
      card.onclick = () => startWizard(p);
      grid.appendChild(card);
    });
    wrap.appendChild(sec);
  });
}

// ─── Wizard state ─────────────────────────────────────────────────────
let wizard = { pattern: null, index: 0, answers: {} };

function startWizard(p) {
  wizard = { pattern: p, index: 0, answers: {} };
  document.getElementById('wizTitle').textContent = p.title;
  document.getElementById('wizDist').textContent = '使用分布: ' + p.dist;
  document.getElementById('wizFormula').innerHTML = p.formula;
  document.getElementById('calcStage').style.display = 'none';
  document.getElementById('resultBox').style.display = 'none';
  document.getElementById('codeBox').style.display = 'none';
  document.getElementById('pyOutputBox').style.display = 'none';
  document.getElementById('errorMsg').style.display = 'none';
  document.getElementById('followUpPanel').style.display = 'none';

  document.getElementById('homeScreen').classList.remove('active');
  document.getElementById('wizScreen').classList.add('active');
  document.getElementById('resetBtn').style.display = 'block';
  window.scrollTo(0,0);
  renderWizardStep();
}

function goHome() {
  document.getElementById('wizScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
  document.getElementById('resetBtn').style.display = 'none';
  window.scrollTo(0,0);
}

function renderWizardStep() {
  const p = wizard.pattern;
  const fields = p.fields;

  // chat log of already-answered fields
  const log = document.getElementById('chatLog');
  log.innerHTML = '';
  for (let i = 0; i < wizard.index; i++) {
    const f = fields[i];
    const row = document.createElement('div');
    row.innerHTML = `
      <div class="chat-q">Q. ${f.label}</div>
      <div class="chat-a-row"><span class="a-label">回答</span><span class="a-val">${displayAnswer(f, wizard.answers[f.id])}</span></div>
    `;
    log.appendChild(row);
  }

  document.getElementById('wizProgress').textContent = `質問 ${Math.min(wizard.index+1, fields.length)} / ${fields.length}`;

  const activeQ = document.getElementById('activeQ');
  if (wizard.index >= fields.length) {
    activeQ.innerHTML = '';
    document.getElementById('calcStage').style.display = 'block';
    return;
  }
  document.getElementById('calcStage').style.display = 'none';

  const f = fields[wizard.index];
  if (f.type === 'select') {
    const btns = f.options.map(o => {
      const [val, label] = o.split(':');
      return `<button class="choice-btn" data-val="${val}">${label}</button>`;
    }).join('');
    activeQ.innerHTML = `
      <div class="q-label">Q. ${f.label}</div>
      ${f.hint ? `<div class="q-hint">💡 ${f.hint}</div>` : ''}
      <div class="choice-row">${btns}</div>
    `;
    activeQ.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => submitField(btn.dataset.val);
    });
  } else {
    const inputType = f.type === 'text' ? 'text' : 'number';
    activeQ.innerHTML = `
      <div class="q-label">Q. ${f.label}</div>
      ${f.hint ? `<div class="q-hint">💡 ${f.hint}</div>` : ''}
      <input type="${inputType}" id="activeInput" value="${f.default ?? ''}" ${f.step ? `step="${f.step}"` : ''}>
      <button class="next-btn" onclick="submitActiveInput()">次へ →</button>
    `;
    const inputEl = document.getElementById('activeInput');
    inputEl.focus();
    inputEl.select();
    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitActiveInput(); });
  }
}

function submitActiveInput() {
  const f = wizard.pattern.fields[wizard.index];
  const el = document.getElementById('activeInput');
  submitField(el.value);
}

function submitField(rawVal) {
  const f = wizard.pattern.fields[wizard.index];
  let val;
  if (f.type === 'text') val = rawVal;
  else val = parseFloat(rawVal);
  wizard.answers[f.id] = val;
  wizard.index++;
  renderWizardStep();
}

function displayAnswer(f, val) {
  if (f.type === 'select') {
    const opt = f.options.find(o => o.split(':')[0] === String(val));
    return opt ? opt.split(':')[1] : val;
  }
  return val;
}

// ─── Calculate ────────────────────────────────────────────────────────
function runCalculate() {
  const p = wizard.pattern;
  const errEl = document.getElementById('errorMsg');
  errEl.style.display = 'none';
  try {
    const result = p.calc(wizard.answers);

    const rv = document.getElementById('resultValues');
    rv.innerHTML = result.vals.map(r => `
      <div class="result-val">
        <div class="label">${r.label}</div>
        <div class="num">${r.val}</div>
      </div>
    `).join('');
    document.getElementById('resultInterpret').textContent = result.interpret;
    document.getElementById('resultBox').style.display = 'block';

    document.getElementById('codeEditor').value = result.code;
    document.getElementById('codeBox').style.display = 'block';
    document.getElementById('pyOutputBox').style.display = 'none';

    document.getElementById('copyBtn').textContent = 'コピー';
    document.getElementById('copyBtn').classList.remove('copied');

    // 結果へ自動スクロール
    setTimeout(() => {
      document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 60);

    // ★ 派生分析サジェストを表示
    renderFollowUps(wizard.pattern.id);

  } catch (e) {
    errEl.textContent = '⚠ ' + (e.message || '入力値を確認してください');
    errEl.style.display = 'block';
    document.getElementById('resultBox').style.display = 'none';
    document.getElementById('codeBox').style.display = 'none';
  }
}

function copyCode() {
  const code = document.getElementById('codeEditor').value;
  navigator.clipboard.writeText(code).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✓ コピー済み';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 2000);
  });
}

// ─── Run Python via Pyodide ────────────────────────────────────────────
async function runPython() {
  const code = document.getElementById('codeEditor').value;
  const outBox = document.getElementById('pyOutputBox');
  const outEl = document.getElementById('pyOutput');
  const runBtn = document.getElementById('runBtn');
  outBox.style.display = 'block';
  outEl.classList.remove('err');
  outEl.textContent = '実行中…';
  runBtn.disabled = true;
  try {
    const pyodide = await pyodideReadyPromise;
    let output = '';
    pyodide.setStdout({ batched: (s) => { output += s + '\n'; } });
    pyodide.setStderr({ batched: (s) => { output += s + '\n'; } });
    await pyodide.runPythonAsync(code);
    outEl.textContent = output || '(出力なし。print() で結果を出してください)';
  } catch (e) {
    outEl.classList.add('err');
    outEl.textContent = '⚠ エラー:\n' + (e.message || String(e));
  } finally {
    runBtn.disabled = false;
  }
}

// ─── Init ───────────────────────────────────────────────────────────
renderHome();
</script>
